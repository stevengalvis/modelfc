name: Temporary deployment SSH diagnostic

on:
  workflow_dispatch:

permissions: {}

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    concurrency:
      group: modelfc-vps-deployment
      cancel-in-progress: false
    steps:
      - name: Validate deployment identity and diagnose SSH authentication
        env:
          DEPLOY_KEY_BASE64: ${{ secrets.MODELFC_DEPLOY_SSH_KEY_BASE64 }}
          DEPLOY_HOST: ${{ vars.MODELFC_DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ vars.MODELFC_DEPLOY_HOST_KEY }}
        shell: python3 {0}
        run: |
          import base64
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          EXPECTED = "SHA256:IpHgSvswGdBNFT6ETalX+2rGwbhdfItuXkDS4JSN1LE"
          EXPECTED_SECRET_SHA256 = "4bb1e4fc7970cfe754415b7a97f0b2661a2c8389795473af3d982aa25e8c8640"

          def run(args, **kwargs):
              # Children never inherit the production secret or other runner secrets.
              return subprocess.run(
                  args, stdin=subprocess.DEVNULL if "input" not in kwargs else None,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  env={"PATH": "/usr/bin:/bin", "HOME": os.environ["HOME"], "LANG": "C"},
                  timeout=60, **kwargs)

          def summarize(stderr):
              # Never copy a line, match group, exception, hostname, or key into output.
              events = []
              markers = {
                  "Connection established.": "TCP_CONNECTED",
                  "is known and matches the ED25519 host key.": "HOST_KEY_VERIFIED_ED25519",
                  "Host key verification failed.": "HOST_KEY_VERIFICATION_FAILED",
                  "REMOTE HOST IDENTIFICATION HAS CHANGED": "HOST_KEY_CHANGED",
                  "Next authentication method: publickey": "AUTH_PUBLICKEY",
                  "Next authentication method: password": "AUTH_PASSWORD",
                  "Next authentication method: keyboard-interactive": "AUTH_KEYBOARD_INTERACTIVE",
                  "No more authentication methods to try.": "AUTH_METHODS_EXHAUSTED",
                  "sign_and_send_pubkey: signing failed": "KEY_SIGNING_FAILED",
                  "error in libcrypto": "KEY_LIBCRYPTO_ERROR",
                  "incorrect passphrase": "KEY_PASSPHRASE_REQUIRED",
                  "Permission denied": "PERMISSION_DENIED",
                  "Connection refused": "CONNECTION_REFUSED",
                  "Connection timed out": "CONNECTION_TIMED_OUT",
                  "Connection reset": "CONNECTION_RESET",
                  "Connection closed": "CONNECTION_CLOSED",
                  "no matching host key type found": "HOST_KEY_ALGORITHM_MISMATCH",
                  "no matching key exchange method found": "KEY_EXCHANGE_ALGORITHM_MISMATCH",
                  "no mutual signature algorithm": "SIGNATURE_ALGORITHM_MISMATCH",
                  "Could not resolve hostname": "HOST_RESOLUTION_FAILED",
              }
              for line in stderr.decode("utf-8", errors="replace").splitlines():
                  for marker, label in markers.items():
                      if marker in line:
                          events.append(label)
                  if EXPECTED in line and "ED25519" in line:
                      if line.startswith("debug1: Offering public key:"):
                          events.append("EXPECTED_KEY_OFFERED")
                      if line.startswith("debug1: Server accepts key:"):
                          events.append("EXPECTED_KEY_ACCEPTED")
                  if line.startswith("Authenticated to ") and 'using "publickey".' in line:
                      events.append("AUTHENTICATED_PUBLICKEY")
                  if line.startswith("debug1: Authentications that can continue:"):
                      for method in ("publickey", "password", "keyboard-interactive"):
                          if method in line.split(": ", 2)[-1].split(","):
                              events.append("SERVER_ALLOWS_" + method.upper().replace("-", "_"))
              return list(dict.fromkeys(events))

          def diagnose():
              os.umask(0o077)
              with tempfile.TemporaryDirectory(prefix="modelfc-ssh-diagnostic-") as directory:
                  key = Path(directory) / "identity"
                  hosts = Path(directory) / "known_hosts"
                  # Require nonempty ASCII and hash exact bytes, without normalization.
                  encoded = os.environb.pop(b"DEPLOY_KEY_BASE64", b"")
                  if (not encoded or not encoded.isascii()
                          or hashlib.sha256(encoded).hexdigest() != EXPECTED_SECRET_SHA256):
                      print("SECRET_BYTES_MISMATCH")
                      return 1
                  print("SECRET_BYTES_MATCH", flush=True)
                  try:
                      decoded = base64.b64decode(encoded, validate=True)
                      if not decoded or base64.b64encode(decoded) != encoded:
                          raise ValueError
                  except Exception:
                      print("BASE64_DECODE_FAILED")
                      return 1
                  try:
                      # Exact decoded bytes, no newline normalization; umask makes mode 0600.
                      key.write_bytes(decoded)
                      public = run(["ssh-keygen", "-y", "-P", "", "-f", str(key)])
                      if public.returncode:
                          raise ValueError
                      fingerprint = run(["ssh-keygen", "-lf", "-", "-E", "sha256"],
                                        input=public.stdout)
                      if fingerprint.returncode:
                          raise ValueError
                      fields = fingerprint.stdout.decode("ascii").split()
                      if len(fields) < 2:
                          raise ValueError
                  except Exception:
                      print("KEY_PARSE_FAILED")
                      return 1
                  if fields[1] != EXPECTED:
                      print("KEY_FINGERPRINT_MISMATCH")
                      return 1
                  print("KEY_FINGERPRINT_MATCH", flush=True)
                  host = os.environ.pop("DEPLOY_HOST", "")
                  host_key = os.environ.pop("DEPLOY_HOST_KEY", "")
                  if not host or not host_key:
                      print("SSH_CONFIGURATION_MISSING")
                      return 1
                  hosts.write_bytes((host_key + "\n").encode())
                  print("SSH_START_UTC=" + datetime.datetime.now(datetime.timezone.utc).isoformat(),
                        flush=True)
                  # Production security options, plus verbosity. No remote command; EOF stdin.
                  args = ["ssh", "-vv", "-T", "-o", "BatchMode=yes", "-o", "IdentitiesOnly=yes",
                          "-o", "StrictHostKeyChecking=yes", "-o", "UserKnownHostsFile=" + str(hosts),
                          "-o", "ForwardAgent=no", "-o", "ConnectTimeout=15",
                          "-o", "ServerAliveInterval=15", "-o", "ServerAliveCountMax=4",
                          "-o", "ClearAllForwardings=yes", "-i", str(key), "modelfc-deploy@" + host]
                  try:
                      result = run(args)
                  except subprocess.TimeoutExpired as error:
                      print(json.dumps({"events": summarize(error.stderr or b""),
                                        "ssh_exit_status": None, "reason": "SSH_DIAGNOSTIC_TIMEOUT"}))
                      return 1
                  # Remote stdout is parsed, never echoed or persisted.
                  try:
                      report = json.loads(result.stdout)
                      invalid = (isinstance(report, dict) and report.get("reason") == "INVALID_REQUEST"
                                 and report.get("requested_sha") == ""
                                 and report.get("promotion_status") == "NOT_ATTEMPTED")
                  except (ValueError, UnicodeError):
                      invalid = False
                  print(json.dumps({"events": summarize(result.stderr),
                                    "ssh_exit_status": result.returncode,
                                    "response": "INVALID_REQUEST" if invalid else "UNEXPECTED_OR_MISSING"}))
                  return 0 if result.returncode == 0 and invalid else 1

          try:
              status = diagnose()
          except Exception:
              # Exception text can contain subprocess arguments or configuration; suppress it.
              print("SSH_DIAGNOSTIC_INTERNAL_ERROR")
              status = 1
          sys.exit(status)
