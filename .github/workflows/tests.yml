name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python lint
        run: |
          python3 -m venv "$RUNNER_TEMP/modelfc-lint"
          "$RUNNER_TEMP/modelfc-lint/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements-lint.lock
          "$RUNNER_TEMP/modelfc-lint/bin/python" -m ruff check .

      - name: Create fresh locked environment
        run: |
          python3 -m venv "$RUNNER_TEMP/modelfc-locked"
          "$RUNNER_TEMP/modelfc-locked/bin/python" -m pip install --require-hashes --only-binary=:all: --no-cache-dir -r requirements-deploy.lock
          "$RUNNER_TEMP/modelfc-locked/bin/python" -m pip check
          "$RUNNER_TEMP/modelfc-locked/bin/python" -B tests/test_deployment_dependencies.py --check-installed

      - name: Install optional private MCP test graph
        run: |
          "$RUNNER_TEMP/modelfc-locked/bin/python" -m pip install --require-hashes --only-binary=:all: --no-cache-dir -r requirements-mcp.lock
          "$RUNNER_TEMP/modelfc-locked/bin/python" -m pip check

      - name: Prepare authenticated ZEN53 offline Python fixture
        run: |
          mkdir -m 700 "$RUNNER_TEMP/zen53-test-tmp"
          python3 docs/zen53/rotation-decoupling/packaging/prepare_python_fixture.py --download --cache "$RUNNER_TEMP/zen53-packages" --output "$RUNNER_TEMP/zen53-python"

      - name: Run test suite
        env:
          ZEN53_PYTHON_FIXTURE: ${{ runner.temp }}/zen53-python
          ZEN53_CHROOT_TEST: "1"
          TMPDIR: ${{ runner.temp }}/zen53-test-tmp
        run: PYTHONPATH=src "$RUNNER_TEMP/modelfc-locked/bin/python" -m unittest discover -v

      - name: Verify real Linux cross-user history and EPL projection ACL publication
        run: |
          sudo -n env PYTHONPATH=src "$RUNNER_TEMP/modelfc-locked/bin/python" - <<'ACL_PY'
          import ctypes.util
          import os
          import unittest
          from tests.test_team_history_acl import cross_uid_available

          if not (os.geteuid() == 0 and ctypes.util.find_library("acl")
                  and cross_uid_available() and os.access("/usr/bin/setfacl", os.X_OK)):
              raise SystemExit("cross-user ACL prerequisites missing; acceptance must not skip")
          names = [
              "tests.test_team_history_acl.PublicHistoryAclTests.test_real_atomic_replacement_cross_uid_isolation",
              "tests.test_corner_api_capabilities.RestrictedCapabilityTests.test_real_readonly_identity_gets_functional_content_without_private_access",
              "tests.test_settlement_review_access.ReviewCrossUserTests",
              "tests.test_pl_public_evidence.ProjectionCrossUserTests.test_public_api_and_corrections_without_raw_read_or_write_access",
              "tests.test_pl_public_evidence.ProjectionCrossUserTests.test_actual_writer_acl_grants_projection_only",
          ]
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          if suite.countTestCases() != 6:
              raise SystemExit("expected six cross-user ACL acceptance tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 6:
              raise SystemExit("cross-user ACL acceptance requires all six tests to pass without skips")
          ACL_PY

      - name: Compile Python sources and tests
        run: '"$RUNNER_TEMP/modelfc-locked/bin/python" -m compileall -q src tests'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend lint
        run: npm run lint

      - name: Type check frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build production frontend
        env:
          NEXT_PUBLIC_MODELFC_API_MODE: mock
        run: npm run build

  release_offline:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    concurrency:
      group: modelfc-release-offline
      cancel-in-progress: false
    steps:
      - name: Checkout trusted default-branch push commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: stevengalvis/modelfc
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require installed exact-release OFFLINE acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_OFFLINE_OUTPUT: ${{ runner.temp }}/release-offline.json
          VALIDATOR_SSH_KEY_BASE64: ${{ secrets.MODELFC_VALIDATOR_AUTOMATION_SSH_KEY_BASE64 }}
          VALIDATOR_HOST: ${{ vars.MODELFC_VALIDATOR_HOST }}
          VALIDATOR_HOST_KEY: ${{ vars.MODELFC_VALIDATOR_HOST_KEY }}
          VALIDATOR_KEY_FINGERPRINT: ${{ vars.MODELFC_VALIDATOR_AUTOMATION_KEY_FINGERPRINT }}
        run: python3 -I ops/vps/github_release_validation.py
      - name: Preserve bounded exact-release evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-offline-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-offline.json
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, frontend, release_offline]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    concurrency:
      group: modelfc-vps-deployment
      cancel-in-progress: false
    steps:
      - name: Build and activate reviewed release on VPS
        timeout-minutes: 75
        env:
          DEPLOY_KEY_BASE64: ${{ secrets.MODELFC_DEPLOY_SSH_KEY_BASE64 }}
          DEPLOY_HOST: ${{ vars.MODELFC_DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ vars.MODELFC_DEPLOY_HOST_KEY }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key_file='' hosts_file='' report_file=''
          failure_reason=DEPLOY_CONFIG_INVALID
          finish() {
            original_status=$?
            trap - EXIT
            set +e
            unset DEPLOY_KEY_BASE64
            python3 - "$report_file" "${EXPECTED_SHA:-}" "$failure_reason" "$original_status" <<'PY'
          import json
          import sys
          import os
          import re
          import tempfile
          from pathlib import Path

          def pairs(items):
              result = {}
              for key, value in items:
                  if key in result:
                      raise ValueError
                  result[key] = value
              return result

          raw_path, sha, stage, original_status = sys.argv[1:]
          original_status = int(original_status)
          reason = stage
          try:
              if stage != "INVALID_DEPLOYMENT_REPORT":
                  raise ValueError
              reason = "SSH_NONZERO_EXIT" if original_status else stage
              with open(raw_path, "rb") as source:
                  raw = source.read(4097)
              if len(raw) > 4096:
                  raise ValueError
              value = json.loads(raw, object_pairs_hook=pairs)
              fields = {"status", "requested_sha", "previous_sha", "final_sha", "fetch_verified",
                        "release_created", "dependency_sync", "tests_status", "tests_run",
                        "promotion_status", "state_boundary_enforced", "reason"}
              reasons = {"OK", "ALREADY_CURRENT", "SUPERSEDED", "INVALID_REQUEST",
                         "DEPLOYMENT_BUSY", "STATE_BOUNDARY_FAILED", "ADMISSION_QUERY_FAILED", "ADMISSION_PROPERTIES_INVALID",
                         "ADMISSION_AGE_WAIT_EXPIRED", "ADMISSION_IDENTITY_CHANGED", "ADMISSION_TARGET_SUPERSEDED", "SOURCE_INVALID",
                         "FETCH_FAILED", "SHA_NOT_ON_MAIN", "ACTIVE_SHA_NOT_ON_MAIN",
                         "DEPENDENCY_SYNC_FAILED", "TESTS_FAILED", "FINAL_SHA_MISMATCH",
                         "PROMOTION_FAILED", "INTERNAL_ERROR", "STORAGE_LIMIT_FAILED"}
              if (type(value) is not dict or set(value) != fields or value["status"] not in {"PASS", "FAIL", "SUPERSEDED"}
                  or value["requested_sha"] != sys.argv[2] or value["reason"] not in reasons
                  or value["promotion_status"] not in {"NOT_ATTEMPTED", "PROMOTED",
                                                      "ALREADY_CURRENT", "SUPERSEDED"}
                  or value["dependency_sync"] not in {"NOT_ATTEMPTED", "INSTALLED"}
                  or value["tests_status"] not in {"NOT_RUN", "PASS", "FAIL"}
                  or type(value["tests_run"]) is not int or not 0 <= value["tests_run"] <= 1000000
                  or any(type(value[k]) is not bool for k in
                         ("fetch_verified", "release_created", "state_boundary_enforced"))
                  or any(value[k] is not None and
                         (type(value[k]) is not str or len(value[k]) != 40 or
                          any(c not in "0123456789abcdef" for c in value[k]))
                         for k in ("previous_sha", "final_sha"))):
                  raise ValueError
              if value["reason"].startswith("ADMISSION_") and (
                  value["status"] != "FAIL" or value["tests_status"] != "NOT_RUN"
                  or value["tests_run"] != 0 or value["promotion_status"] != "NOT_ATTEMPTED"):
                  raise ValueError
              if value["reason"] == "ADMISSION_TARGET_SUPERSEDED" and (
                  value["previous_sha"] is not None or value["final_sha"] is not None
                  or value["fetch_verified"] is not True or value["release_created"] is not True
                  or value["dependency_sync"] != "INSTALLED" or value["state_boundary_enforced"] is not True):
                  raise ValueError
              if value["status"] == "PASS" and value["final_sha"] != sys.argv[2]:
                  raise ValueError
              if value["status"] == "PASS" and value["reason"] == "OK" and (
                  value["tests_status"] != "PASS" or value["tests_run"] <= 0
                  or value["promotion_status"] != "PROMOTED"
                  or value["release_created"] is not True or value["fetch_verified"] is not True
                  or value["dependency_sync"] != "INSTALLED"):
                  raise ValueError
              if value["status"] == "PASS" and value["reason"] == "ALREADY_CURRENT" and (
                  value["promotion_status"] != "ALREADY_CURRENT" or value["tests_status"] != "NOT_RUN"
                  or value["tests_run"] != 0 or value["release_created"] is not False):
                  raise ValueError
              if value["status"] == "SUPERSEDED" and (
                  value["reason"] != "SUPERSEDED" or value["fetch_verified"] is not True
                  or value["promotion_status"] != "SUPERSEDED" or value["final_sha"] is None):
                  raise ValueError
              if value["status"] in {"PASS", "SUPERSEDED"} and value["state_boundary_enforced"] is not True:
                  raise ValueError
              if (value["status"] == "PASS" and value["reason"] not in {"OK", "ALREADY_CURRENT"}
                  or value["status"] == "FAIL" and value["reason"] in {"OK", "ALREADY_CURRENT", "SUPERSEDED"}
                  or original_status and value["status"] != "FAIL"):
                  raise ValueError
          except (OSError, ValueError, KeyError, TypeError, RecursionError):
              value = dict(status="FAIL", requested_sha=sha if re.fullmatch("[0-9a-f]{40}", sha) else None,
                           previous_sha=None, final_sha=None, fetch_verified=False, release_created=False,
                           dependency_sync="NOT_ATTEMPTED", tests_status="NOT_RUN", tests_run=0,
                           promotion_status="NOT_ATTEMPTED", state_boundary_enforced=False, reason=reason)
          sanitized = json.dumps(value, sort_keys=True) + "\n"
          print(sanitized, end="")
          # Best effort atomic copy: publication must not alter deployment success/failure.
          temporary = None
          try:
              with tempfile.NamedTemporaryFile(mode="w", dir=os.environ["RUNNER_TEMP"], delete=False) as output:
                  temporary = output.name
                  output.write(sanitized)
              os.replace(temporary, Path(os.environ["RUNNER_TEMP"]) / "modelfc-deployment-report.json")
          except (OSError, KeyError):
              pass
          finally:
              if temporary:
                  try: os.unlink(temporary)
                  except OSError: pass
          sys.exit(0 if not original_status and value["status"] in {"PASS", "SUPERSEDED"} else 1)
          PY
            result=$?
            rm -f "$key_file" "$hosts_file" "$report_file"
            exit "$result"
          }
          trap finish EXIT
          [[ "${EXPECTED_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "${DEPLOY_HOST:-}" && -n "${DEPLOY_HOST_KEY:-}" ]]
          failure_reason=DEPLOY_TEMPFILE_FAILED
          key_file="$(mktemp)"
          hosts_file="$(mktemp)"
          report_file="$(mktemp)"
          failure_reason=DEPLOY_KEY_INVALID
          python3 - "$key_file" <<'KEY_PY'
          import base64
          import os
          from pathlib import Path
          import subprocess
          import sys

          try:
              encoded = os.environ.pop("DEPLOY_KEY_BASE64", "").encode("ascii")
              if not encoded:
                  raise ValueError
              decoded = base64.b64decode(encoded, validate=True)
              if not decoded or base64.b64encode(decoded) != encoded:
                  raise ValueError
              Path(sys.argv[1]).write_bytes(decoded)
              env = {"PATH": "/usr/bin:/bin", "LANG": "C"}
              public = subprocess.run(
                  ["ssh-keygen", "-y", "-P", "", "-f", sys.argv[1]],
                  stdin=subprocess.DEVNULL, capture_output=True, env=env, timeout=10)
              if public.returncode:
                  raise ValueError
              fingerprint = subprocess.run(
                  ["ssh-keygen", "-lf", "-", "-E", "sha256"],
                  input=public.stdout, capture_output=True, env=env, timeout=10)
              if (fingerprint.returncode or fingerprint.stdout.decode("ascii").split()[1]
                      != "SHA256:IpHgSvswGdBNFT6ETalX+2rGwbhdfItuXkDS4JSN1LE"):
                  raise ValueError
          except Exception:
              sys.exit(1)
          KEY_PY
          unset DEPLOY_KEY_BASE64
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$hosts_file"
          failure_reason=INVALID_DEPLOYMENT_REPORT
          ssh_status=0
          # Bound raw local capture; an interrupted SSH still leaves remote outcome unknown.
          { (ulimit -f 8 && exec ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts_file" -o ForwardAgent=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o ClearAllForwardings=yes -i "$key_file" \
            "modelfc-deploy@$DEPLOY_HOST" "deploy stevengalvis/modelfc $EXPECTED_SHA" ) > "$report_file" 2>/dev/null || ssh_status=$?; } 2>/dev/null
          exit "$ssh_status"

      - name: Publish sanitized deployment report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/modelfc-deployment-report.json
          if-no-files-found: ignore
          retention-days: 7
