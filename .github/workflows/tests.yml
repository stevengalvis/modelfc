name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create fresh locked environment
        run: |
          python3 -m venv "$RUNNER_TEMP/modelfc-locked"
          "$RUNNER_TEMP/modelfc-locked/bin/python" -m pip install --require-hashes --only-binary=:all: --no-cache-dir -r requirements-deploy.lock
          "$RUNNER_TEMP/modelfc-locked/bin/python" -m pip check
          "$RUNNER_TEMP/modelfc-locked/bin/python" -B tests/test_deployment_dependencies.py --check-installed

      - name: Run test suite
        run: PYTHONPATH=src "$RUNNER_TEMP/modelfc-locked/bin/python" -m unittest discover -v

      - name: Compile Python sources and tests
        run: '"$RUNNER_TEMP/modelfc-locked/bin/python" -m compileall -q src tests'
