name: Production test budget systemd acceptance
on:
  pull_request:
    paths:
      - 'ops/ci/test_progress_systemd.py'
      - 'ops/vps/patches/*.patch'
      - 'ops/vps/deploy_main.py'
      - 'tests/test_progress_acceptance.py'
      - 'tests/test_test_admission.py'
      - 'tests/test_vps_runtime_boundaries.py'
      - 'tests/fixtures/vps/deploy_main_*.py.txt'
      - 'deploy/modelfc-postmerge-tests.service'
      - '.github/workflows/test-progress-systemd.yml'
permissions:
  contents: read
concurrency:
  group: diagnostic-systemd-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact candidate and disposable systemd acceptance
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            /usr/bin/python3 -I -B ops/ci/test_progress_systemd.py --source "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/diagnostic-acceptance"
      - name: Always clean disposable fixtures
        if: always()
        run: |
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            /usr/bin/python3 -I -B ops/ci/test_progress_systemd.py --cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostic-acceptance-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/diagnostic-acceptance
          retention-days: 7
          if-no-files-found: error
